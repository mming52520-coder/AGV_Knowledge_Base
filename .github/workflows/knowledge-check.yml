name: Knowledge base checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  knowledge-check:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show Python version
        run: python3 --version
      - name: Verify frozen graph bundle
        working-directory: 00_System/Graph_History/Tools
        run: sha256sum -c MANIFEST.sha256
      - name: Test index logic
        run: python3 -m unittest discover -s 00_System/AI_Index -p 'test_*.py' -v
      - name: Test existing isolated graph logic
        run: |
          python3 -m unittest discover -s 00_System/Graph_History/Tools/v2_snapshot -p 'test_*.py' -v
          python3 -m unittest discover -s 00_System/Graph_History/Tools/obsidian_projection -p 'test_*.py' -v
      - name: Check index, links, and immutable history
        run: python3 00_System/AI_Index/kb_index.py check
      - name: Verify deterministic index files
        run: |
          sha256sum 00_System/AI_Index/manifest.json 00_System/AI_Index/documents.jsonl 00_System/AI_Index/relations.jsonl > /tmp/kb-index-before.sha256
          python3 00_System/AI_Index/kb_index.py build
          sha256sum 00_System/AI_Index/manifest.json 00_System/AI_Index/documents.jsonl 00_System/AI_Index/relations.jsonl > /tmp/kb-index-once.sha256
          python3 00_System/AI_Index/kb_index.py build
          sha256sum 00_System/AI_Index/manifest.json 00_System/AI_Index/documents.jsonl 00_System/AI_Index/relations.jsonl > /tmp/kb-index-twice.sha256
          cmp /tmp/kb-index-before.sha256 /tmp/kb-index-once.sha256
          cmp /tmp/kb-index-once.sha256 /tmp/kb-index-twice.sha256
          git diff --exit-code -- 00_System/AI_Index/manifest.json 00_System/AI_Index/documents.jsonl 00_System/AI_Index/relations.jsonl
